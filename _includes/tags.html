{% comment %}Renders a list of tag links. Usage: {% include tags.html tags=page.tags %}{% endcomment %}
{% if include.tags and include.tags.size > 0 %}
<ul class="tags">
  {% for tag in include.tags %}
  <li><a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a></li>
  {% endfor %}
</ul>
{% endif %}
