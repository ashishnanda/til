---
layout: default
---
<article class="note">
  <header class="note-header">
    <h1 class="note-title">{{ page.title }}</h1>
    <p class="note-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
    </p>
    {% include tags.html tags=page.tags %}
  </header>

  <div class="note-content">
    {{ content }}
  </div>

  <nav class="note-nav">
    {% if page.previous %}
      <a class="prev" href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title }}</a>
    {% endif %}
    {% if page.next %}
      <a class="next" href="{{ page.next.url | relative_url }}">{{ page.next.title }} &rarr;</a>
    {% endif %}
  </nav>
</article>
