# Issues as inbox: turns issues opened by the repo owner into reading-list
# entries and TIL notes. See CLAUDE.md ("Issue inbox") before changing this.
#
# Security rules (do not weaken):
# - Only `issues: opened`. Only the repo owner's issues are processed.
# - Issue fields are passed ONLY through `env:` and parsed in scripts/inbox.py.
#   Never put ${{ github.event.issue.* }} inside a `run:` script.
# - Minimal permissions, no secrets beyond GITHUB_TOKEN, actions pinned to SHAs.
name: Issue inbox

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  inbox:
    # Other authors' issues skip the job entirely: no comment, no commit.
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One issue at a time, so commits never race each other.
    concurrency:
      group: issue-inbox
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Process issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python scripts/inbox.py
